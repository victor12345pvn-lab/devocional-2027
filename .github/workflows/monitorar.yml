name: Monitorar site no ar

# Verifica o site publicado a cada 6 horas. Se algo falhar, o GitHub envia e-mail ao dono do repositório.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Página inicial, dados, arte e áudio
        run: |
          BASE="https://devocional-2027.pages.dev"
          UA="Mozilla/5.0 (monitor devocional-2027)"
          falhou=0
          for caminho in "/" "/data/mes/12.json" "/assets/meses/dezembro.webp" "/app.js" "/assets/audio/dezembro/08.mp3"; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" --connect-timeout 10 --max-time 30 -r 0-2047 --retry 2 --retry-delay 5 "$BASE$caminho" || echo "000")
            echo "$caminho -> $codigo"
            case "$codigo" in 200|206) ;; *) echo "FALHA em $caminho"; falhou=1 ;; esac
          done
          if ! curl -s -A "$UA" --max-time 30 "$BASE/" | grep -q "365 DIAS COM MARIA"; then echo "Página sem o conteúdo esperado"; falhou=1; fi
          if [ "$falhou" = "1" ]; then exit 1; fi
          echo "Site funcionando."
